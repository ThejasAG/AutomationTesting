# Real PR QA workflow for the iOS app repos (e.g. vya-consumer).
#
# Copy this to `.github/workflows/pr-ios-qa.yml` in the APP repo. On every PR it
# asks the automation platform to smart-select the affected scenarios (from the
# dependency graph), build the PR branch, run them on the simulator, and comment
# the verdict back on the PR.
#
# iOS simulators can't run on GitHub-hosted runners, so this uses a SELF-HOSTED
# macOS runner — the same Mac where the platform, Appium and Xcode live. Register
# one: repo -> Settings -> Actions -> Runners -> New self-hosted runner (macOS).
#
# Secrets to set on the app repo (Settings -> Secrets -> Actions):
#   PLATFORM_URL   e.g. http://localhost:8000   (runner is on the platform Mac)
#   CI_SECRET      must match CI_SECRET in the platform's .env (optional but advised)

name: PR iOS QA (smart selection)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qa:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Trigger smart QA on the automation platform
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "Requesting smart QA for $REPO#$PR"
          curl -sf -X POST "$PLATFORM_URL/api/v1/ci/pr-autotest" \
            -H "Content-Type: application/json" \
            -H "X-CI-Secret: $CI_SECRET" \
            -d "{\"repo\": \"$REPO\", \"pr_number\": $PR}"
          echo ""
          echo "The platform will build the PR branch, run the affected scenarios, and comment the result on this PR."
