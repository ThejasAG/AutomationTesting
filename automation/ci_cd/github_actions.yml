name: AI-Powered Mobile Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      # Mocking Appium or other services here if needed
      
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Required for git diff

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Setup Appium
      run: |
        npm install -g appium
        appium driver install uiautomator2
        appium &
        
    - name: Start Automation API
      run: |
        nohup uvicorn automation.api.main:app --host 0.0.0.0 --port 8000 &
        sleep 5 # wait for server to start
        
    - name: Trigger Automation API
      run: |
        echo "Triggering Automation Platform..."
        response=$(curl -s -X POST http://localhost:8000/automation/run \
          -H "Content-Type: application/json" \
          -d '{
            "test_path": "tests/login",
            "device_id": "emulator-5554",
            "triggered_by": "GitHub Actions",
            "build_number": "${{ github.run_number }}",
            "branch": "${{ github.ref_name }}",
            "commit_sha": "${{ github.sha }}"
          }')
          
        run_id=$(echo $response | jq -r .run_id)
        echo "Started Run ID: $run_id"
        
        # Poll for completion
        while true; do
          status=$(curl -s http://localhost:8000/automation/status/$run_id | jq -r .status)
          echo "Current Status: $status"
          if [ "$status" = "Passed" ] || [ "$status" = "Failed" ] || [ "$status" = "Stopped" ]; then
            if [ "$status" = "Failed" ]; then
              exit 1
            fi
            break
          fi
          sleep 5
        done
        
    - name: Upload RCA Reports
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: rca-reports
        path: reports/
