[project]
name = "ai-mobile-automation-platform"
version = "1.0.0"
description = "AI-Powered Mobile Automation Platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "python-dateutil>=2.8",
    "jinja2>=3.0",
    "markdown>=3.0",
    "Appium-Python-Client>=3.0",
    "GitPython>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.0",
    "mypy>=1.5",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["automation/tests"]